framework_name: Demand Pattern & Operational Value V1
framework_version: '1.0'
status: FROZEN
source: manual_business_confirmation
scope: Task Type only; no WHERE dimension analysis
analysis_period: 2023-2025 August same-period cohorts
final_priority_rules:
  P1_CORE_DEMAND: PERSISTENT + STABLE CORE_STABLE pattern + HIGH_VOLUME_VALUE or HIGH_REVENUE_VALUE
  P2_GROWTH_DEMAND: CORE_RISING or EMERGING + HIGH_VOLUME_VALUE or HIGH_REVENUE_VALUE
  P3_HIGH_VALUE_NICHE: HIGH_REVENUE_VALUE without P1/P2 qualification and not VOLATILE/CORE_DECLINING
  P4_WATCHLIST: declining, volatile, low-sample, or insufficiently established candidates
operational_logic: HIGH_VOLUME_VALUE OR HIGH_REVENUE_VALUE; no AND gate
ranking: Rule-based lexicographic tier ranking; no continuous weighted score
