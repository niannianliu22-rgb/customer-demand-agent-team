version: '3.0'
status: IMPLEMENTED_CONCRETE_CLI_BINDING
purpose: Explicit concrete model and effort bindings consumed by local CLI runtime; no API key is read or required.
authentication_policy: {api_keys_allowed: false, credential_source: CLI_LOGIN_SESSION, preflight_makes_model_calls: true}
providers:
  claude_cli:
    executable: claude
    availability_check: noninteractive_health_json
    health_prompt: 'Return exactly: {"status":"OK"}'
    health_expected: {status: OK}
    invocation: claude_print_explicit
  codex_cli:
    executable: codex
    availability_check: login_status
    auth_status_command: [login, status]
    authenticated_text: Logged in
    invocation: codex_exec_explicit
bindings:
  medium_codex: {provider: codex_cli, concrete_model: gpt-5.6-terra, invocation_model: gpt-5.6-terra, reasoning_effort: medium, required_tier: TIER_1_MEDIUM, invocation_mode: codex_exec_explicit, fallback_policy: AGENT_BLOCKED}
  medium_claude_sonnet: {provider: claude_cli, concrete_model: claude-sonnet-5, invocation_model: sonnet, reasoning_effort: high, required_tier: TIER_1_MEDIUM, invocation_mode: claude_print_explicit, fallback_policy: AGENT_BLOCKED}
  medium_claude_sonnet_medium: {provider: claude_cli, concrete_model: claude-sonnet-5, invocation_model: sonnet, reasoning_effort: medium, required_tier: TIER_1_MEDIUM, invocation_mode: claude_print_explicit, fallback_policy: AGENT_BLOCKED}
  strong_codex: {provider: codex_cli, concrete_model: gpt-5.6-terra, invocation_model: gpt-5.6-terra, reasoning_effort: high, required_tier: TIER_2_STRONG_REASONING, invocation_mode: codex_exec_explicit, fallback_policy: AGENT_BLOCKED}
  critical_maker_codex: {provider: codex_cli, concrete_model: gpt-5.6-terra, invocation_model: gpt-5.6-terra, reasoning_effort: xhigh, required_tier: TIER_3_CRITICAL_REASONING, invocation_mode: codex_exec_explicit, fallback_policy: AGENT_BLOCKED, role: Maker}
  critical_checker_claude_opus: {provider: claude_cli, concrete_model: claude-opus-5, invocation_model: opus, reasoning_effort: max, required_tier: TIER_3_CRITICAL_REASONING, invocation_mode: claude_print_explicit, fallback_policy: AGENT_BLOCKED, role: Checker}
