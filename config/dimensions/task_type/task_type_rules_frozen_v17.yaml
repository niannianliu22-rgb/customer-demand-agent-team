  rule: 补考 / 补考作业 and exact resit variants -> 补考; 补考 distinct from 考试
- rule_id: RULE-022
  rule: exact rewrite variants -> 补考, not essay or ME
- rule_id: RULE-019
  rule: ordinary proofreading -> 润色-proofreading
- rule_id: RULE-019
  rule: explicit 大论文/毕业论文/Dissertation润色 -> 毕业论文润色
- rule_id: RULE-019
  rule: proofreading with parseable word_count > 10000 -> 毕业论文润色
- rule_id: RULE-026
  rule: exact confirmed pure word-count historical values -> essay; explicit task
    semantics takes priority
- rule_id: RULE-023
  rule: SVIP/VIP -> 预存; 安心包/DP -> DP; 半包/包课 -> 包课; 毕业无忧 -> 毕业无忧
- rule_id: RULE-024
  rule: 质检 / 毕业论文质检 / 论文质检 -> 质检
- rule_id: RULE-025
  rule: confirmed LR/ME/literature/partial dissertation services -> 毕业论文半包
